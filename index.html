<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdi Web | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0d1117; /* Midabka madowga casriga ah */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }

        .login-container {
            background: #161b22;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 380px;
            border: 1px solid #30363d;
            text-align: center;
        }

        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #c9d1d9;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 5px rgba(88, 166, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #1f6feb, #388bfd);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            background: linear-gradient(90deg, #388bfd, #1f6feb);
        }

        .footer-text {
            margin-top: 20px;
            font-size: 12px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Halkan waxaan ku daraynaa Logo (Emoji) -->
        <div class="logo">🐺</div> 
        <h2>Abdi Web</h2>
        <p>Welcome back. Your system is ready.</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Geli username-kaaga" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Geli password-kaaga" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="footer-text">
            Protected by Cloudflare Workers
        </div>
    </div>


    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.querySelector('.btn');
            const workerUrl = 'https://a.dirxx.workers.dev/verify'; 

            btn.innerText = "Checking...";

            try {
                const response = await fetch(workerUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user: username, key: password })
                });
                const data = await response.json();
                if (data.status === true) {
                    btn.innerText = "Success!";
                    btn.style.background = "#238636"; 
                } else {
                    btn.innerText = "Invalid Key";
                    btn.style.background = "#da3633"; 
                    setTimeout(() => {
                        btn.innerText = "Sign In";
                        btn.style.background = "linear-gradient(90deg, #1f6feb, #388bfd)";
                    }, 2000);
                }
            } catch (error) {
                btn.innerText = "Network Error";
                btn.style.background = "#da3633";
            }
        });
    </script>
</body>

</html>
